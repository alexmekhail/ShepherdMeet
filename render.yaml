services:
  - type: web
    name: shepherdmeet-backend
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      # Neon connection string (postgres://...). Set after creating the Neon project.
      - key: ConnectionStrings__DefaultConnection
        sync: false
      # Optional: only needed if you want real Google sign-in to work in
      # production. The demo-login buttons work without these.
      - key: Authentication__Google__ClientId
        sync: false
      - key: Authentication__Google__ClientSecret
        sync: false
      # Comma-separated. Defaults (in code) already cover the two real
      # admin emails plus the seeded demo admin; only set this to override.
      - key: AdminEmails
        sync: false
      # The frontend static site's public URL, e.g. https://shepherdmeet-frontend.onrender.com
      # Set once the frontend service exists (both services' URLs are only
      # known after first deploy, so this can't be wired automatically).
      - key: AllowedOrigins
        sync: false
      - key: FrontendUrl
        sync: false

  - type: web
    name: shepherdmeet-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: build
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # The backend API's public URL, e.g. https://shepherdmeet-backend.onrender.com
      # Baked in at build time, so set this before the first build.
      - key: REACT_APP_API_URL
        sync: false
