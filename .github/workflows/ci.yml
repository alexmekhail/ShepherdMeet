name: Build and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: shepherdmeet_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=localhost;Port=5432;Database=shepherdmeet_test;Username=postgres;Password=postgres
      PORT: 5209
      TZ: UTC
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        working-directory: ./backend
        run: dotnet restore

      - name: Build
        working-directory: ./backend
        run: dotnet build --no-restore --configuration Release

      - name: Migrate and test the scheduling API
        run: |
          dotnet backend/bin/Release/net8.0/ShepherdMeet.dll --migrate
          dotnet backend/bin/Release/net8.0/ShepherdMeet.dll > /tmp/shepherdmeet-api.log 2>&1 &
          api_pid=$!
          PORT=5210 dotnet backend/bin/Release/net8.0/ShepherdMeet.dll > /tmp/shepherdmeet-api2.log 2>&1 &
          api2_pid=$!
          trap 'kill "$api_pid" "$api2_pid"' EXIT
          for port in 5209 5210; do
            curl --silent --show-error --fail --retry 15 --retry-connrefused --retry-delay 1 "http://localhost:$port/api/health"
          done
          SHEPHERDMEET_SECOND_TEST_URL=http://localhost:5210/api python3 tests/scheduling_integration.py
          PGPASSWORD=postgres psql -h localhost -U postgres -d shepherdmeet_test -f tests/appointment_constraints.sql

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run tests
        working-directory: ./frontend
        run: npm test -- --watchAll=false --runInBand

      - name: Build
        working-directory: ./frontend
        run: npm run build
