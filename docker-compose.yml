services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: shepherdmeet
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      # Published on 5433 to avoid clashing with a Postgres already
      # installed on the host; the backend talks to it on 5432 internally.
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    ports:
      - "5209:8080"
    environment:
      PORT: 8080
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=shepherdmeet;Username=postgres;Password=postgres
      Authentication__Google__ClientId: ${GOOGLE_CLIENT_ID}
      Authentication__Google__ClientSecret: ${GOOGLE_CLIENT_SECRET}
      AllowedOrigins: http://localhost:3000
      FrontendUrl: http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        REACT_APP_API_URL: http://localhost:5209
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
