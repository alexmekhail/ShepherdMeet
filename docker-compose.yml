services:
  backend:
    build:
      context: ./backend
    ports:
      - "5209:8080"
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Data Source=/data/shepherdmeet.db
      Authentication__Google__ClientId: ${GOOGLE_CLIENT_ID}
      Authentication__Google__ClientSecret: ${GOOGLE_CLIENT_SECRET}
      AllowedOrigins: http://localhost:3000
      FrontendUrl: http://localhost:3000
    volumes:
      - sqlite_data:/data

  frontend:
    build:
      context: ./frontend
      args:
        REACT_APP_API_URL: http://localhost:5209
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  sqlite_data:
